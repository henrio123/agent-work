name: Test Gate

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run all tests
        shell: bash
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash tools/test-all.sh
