# OpenClaw Gateway Configuration — Example
#
# This file documents the intended agent profiles and workspace setup.
# It is NOT loaded automatically. Copy and adapt for your deployment.

gateway:
  workspace: /Users/henr/dev/agent-work
  skills:
    - path: skills/dev-pipeline
    - path: skills/barger-flow

# Agent profiles map roles to model configurations and constraints.
# These correspond to the role definitions in projects/<id>/agents.json.
agents:
  PM:
    model: claude-sonnet-4-6
    description: "Product Manager — writes PM briefs, defines scope and acceptance criteria"
    constraints:
      - "Cannot propose code changes"
    skills:
      - dev-pipeline
      - barger-flow

  UX_ANALYST:
    model: claude-sonnet-4-6
    description: "UX Analyst — audits flows, documents usability findings"
    constraints:
      - "Cannot write implementation code"
    skills:
      - barger-flow

  ARCHITECT:
    model: claude-sonnet-4-6
    description: "Architect — designs components, file changes, constraints, risks"
    constraints:
      - "Cannot write implementation code"
    skills:
      - dev-pipeline
      - barger-flow

  DEV:
    model: claude-sonnet-4-6
    description: "Developer — implements code, writes patches and dev notes"
    constraints:
      - "Cannot change scope or acceptance criteria"
    skills:
      - dev-pipeline
      - barger-flow

  QA:
    model: claude-sonnet-4-6
    description: "QA — tests implementation, writes test report"
    constraints:
      - "Cannot change product decisions"
    skills:
      - dev-pipeline
      - barger-flow

# Command dispatch — maps slash commands to tool invocations.
# The gateway resolves these via the skill's SKILL.md documentation.
commands:
  barger:
    status:
      tool: ./tools/project-dashboard.sh
      description: "Aggregated project dashboard"
    pick:
      tool: ./tools/project-next-pick.sh
      description: "Deterministic backlog picker"
    drive:
      tool: ./tools/project-next-drive.sh
      args: ["--dry_run"]
      description: "One-shot project driver"
    loop:
      tool: ./tools/project-drive-loop.sh
      args: ["--sleep", "5", "--max", "100"]
      description: "Drive loop autopilot"
    create-ticket:
      tool: ./tools/create-ticket.sh
      description: "Create ticket + backlog item"
    audit:
      type: instructional
      description: "UX audit — agent follows SKILL.md checklist"
